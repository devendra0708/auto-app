<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>People · Meridian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=IBM+Plex+Mono:wght@500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="people">
    <div id="app-shell">
      <div data-shell-main>
        <main class="main">
          <div class="page-header">
            <div>
              <h1 data-testid="people-title">People</h1>
              <p>Directory of Northline teammates across departments.</p>
            </div>
            <div class="actions">
              <button id="export-selected" class="secondary" type="button" data-testid="export-selected">Export selected</button>
              <button id="open-invite" type="button" data-testid="open-invite">Invite person</button>
            </div>
          </div>

          <section class="panel">
            <div class="table-toolbar">
              <div class="field">
                <label for="people-search">Search</label>
                <input id="people-search" type="search" placeholder="Name, email, role…" data-testid="people-search" />
              </div>
              <div class="field">
                <label for="dept-filter">Department</label>
                <select id="dept-filter" data-testid="dept-filter">
                  <option value="all">All departments</option>
                  <option value="Engineering">Engineering</option>
                  <option value="Quality">Quality</option>
                  <option value="Product">Product</option>
                  <option value="People">People</option>
                  <option value="Finance">Finance</option>
                  <option value="Support">Support</option>
                  <option value="Sales">Sales</option>
                  <option value="Design">Design</option>
                </select>
              </div>
              <div class="field">
                <label for="status-filter">Status</label>
                <select id="status-filter" data-testid="status-filter">
                  <option value="all">All statuses</option>
                  <option value="active">Active</option>
                  <option value="pending">Pending</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>

            <div id="people-loading" class="table-loading hidden" data-testid="people-loading">
              <div class="loader"></div>
              <span>Loading directory…</span>
            </div>

            <div class="table-wrap">
              <table data-testid="people-table">
                <thead>
                  <tr>
                    <th><input id="select-all" type="checkbox" data-testid="select-all" /></th>
                    <th data-sort="name" data-testid="sort-name">Person</th>
                    <th data-sort="dept" data-testid="sort-dept">Department</th>
                    <th data-sort="role" data-testid="sort-role">Role</th>
                    <th data-sort="location" data-testid="sort-location">Location</th>
                    <th data-sort="status" data-testid="sort-status">Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="people-tbody" data-testid="people-tbody"></tbody>
              </table>
            </div>

            <div id="people-empty" class="empty-state hidden" data-testid="people-empty">No people match your filters</div>

            <div class="pagination">
              <span id="selected-count" data-testid="selected-count">0 selected</span>
              <div class="actions" style="margin: 0">
                <button id="prev-page" class="secondary" type="button" data-testid="prev-page">Previous</button>
                <span id="page-info" data-testid="page-info">Page 1</span>
                <button id="next-page" class="secondary" type="button" data-testid="next-page">Next</button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="invite-backdrop" class="modal-backdrop" data-testid="invite-backdrop">
      <div class="modal" role="dialog" aria-modal="true" data-testid="invite-modal">
        <h3>Invite to Northline</h3>
        <p>Send a workspace invite. They’ll get email instructions to join Meridian.</p>
        <div id="invite-form">
          <div class="field">
            <label for="invite-email">Work email</label>
            <input id="invite-email" name="invite-email" type="email" placeholder="name@northline.co" data-testid="invite-email" />
            <div class="field-error" data-field-error="invite-email" data-testid="invite-email-error"></div>
          </div>
          <div class="field">
            <label for="invite-role">Role</label>
            <select id="invite-role" data-testid="invite-role">
              <option value="member">Member</option>
              <option value="admin">Admin</option>
              <option value="viewer">Viewer</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="send-invite" type="button" data-testid="send-invite">Send invite</button>
          <button id="close-invite" class="secondary" type="button" data-testid="close-invite">Cancel</button>
        </div>
      </div>
    </div>

    <script src="/js/store.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
